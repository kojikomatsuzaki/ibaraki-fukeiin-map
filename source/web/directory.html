<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{PREFECTURE}}の風景印・郵便局一覧。{{COVERAGE}}を郵便局名・地域・住所で検索できます。">
<link rel="canonical" href="{{CANONICAL_URL}}post-offices/">
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../directory.css?v={{SOURCE_REVISION}}">
<script src="../config.js?v={{SOURCE_REVISION}}" defer></script>
<script src="../catalog-view.js?v={{SOURCE_REVISION}}" defer></script>
<script src="../export.js?v={{SOURCE_REVISION}}" defer></script>
<script src="../print.js?v={{SOURCE_REVISION}}" defer></script>
</head><body>
<header class="directory-header">
<a href="../">地図へ戻る</a><p class="eyebrow">{{EYEBROW}}</p>
<h1>{{TITLE}}</h1><h2>風景印・郵便局一覧</h2>
<p>{{COVERAGE}}。確認日 {{VERIFIED_AT}}</p>
<nav><a href="../exports/stamps.csv" download>全件のCSVを保存</a><a id="list-print" href="../print/">印刷用リスト</a></nav>
</header>
<main class="directory-main">
<div class="directory-tools">
<label>検索 <input id="list-search" type="search" placeholder="郵便局名・市町村・住所"></label>
<label>地域 <select id="list-region"><option value="all">全地域</option>{{REGION_OPTIONS}}</select></label>
{{STATUS_FILTERS}}
<span id="list-count" role="status"></span>
</div>
{{EXPORT_TOOLS}}
<noscript><p>JavaScriptが無効のため、廃止・閉鎖・一時閉鎖も含む全件を表示しています。</p></noscript>
<div class="table-wrap"><table><thead><tr><th scope="col">選択</th><th scope="col">風景印</th><th scope="col">郵便局</th><th scope="col">住所・状態・位置の注記</th><th scope="col">地図</th></tr></thead><tbody id="list-body">{{DIRECTORY_ROWS}}</tbody></table></div>
<footer class="guide-notes">
<p>郵便局名・画像を押すと、日本郵便の風景印紹介ページを開きます。同じ郵便局の複数図案を含みます。取扱状況は訪問前に公式情報をご確認ください。</p>
<p>出典：<a href="{{SOURCE_URL}}" target="_blank" rel="noopener noreferrer">日本郵便「茨城県の風景印」</a>。風景印画像等の権利は各権利者に帰属します。本サイトは非公式です。</p>
</footer>
</main></body></html>
