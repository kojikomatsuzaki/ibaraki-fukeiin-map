<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PREFECTURE}}の風景印・郵便局 印刷用リスト</title>
<link rel="canonical" href="{{CANONICAL_URL}}print/">
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../print.css?v={{SOURCE_REVISION}}">
<script src="../config.js?v={{SOURCE_REVISION}}" defer></script>
<script src="../catalog-view.js?v={{SOURCE_REVISION}}" defer></script>
<script src="../print.js?v={{SOURCE_REVISION}}" defer></script>
</head><body>
<header><a class="screen-only" href="../">地図へ戻る</a><p class="eyebrow">{{EYEBROW}}</p>
<h1>{{PREFECTURE}}の風景印・郵便局リスト</h1><p>{{COVERAGE}}／確認日 {{VERIFIED_AT}}</p>
<p id="filter-summary" aria-live="polite"></p></header>
<div class="print-tools">
<label>検索 <input id="list-search" type="search" placeholder="郵便局名・住所"></label>
<label>地域 <select id="list-region"><option value="all">全地域</option>{{REGION_OPTIONS}}</select></label>
<label><input id="list-history" type="checkbox">廃止・一時閉鎖も含める</label>
<button type="button" id="print-now">印刷・PDF保存</button><a href="../exports/stamps.csv" download>全件のCSV</a><span id="list-count"></span>
</div>
<p class="screen-only">表示中の一覧を印刷できます。印刷画面でPDFとして保存することもできます。</p>
<noscript><p>JavaScriptが無効のため、廃止・閉鎖・一時閉鎖も含む全件を表示しています。</p></noscript>
<div class="table-wrap"><table><thead><tr><th scope="col">郵便局</th><th scope="col">住所・状態・位置の注記</th><th scope="col">地図</th></tr></thead><tbody id="list-body">{{PRINT_ROWS}}</tbody></table></div>
<footer><p>出典：日本郵便「茨城県の風景印」。同じ郵便局の複数図案を含みます。訪問前に公式情報で取扱状況をご確認ください。</p><p><a href="{{CANONICAL_URL}}">{{CANONICAL_URL}}</a></p></footer>
</body></html>
